# Coverage-guided fuzzing harness for the pure `did_ops` validators
# (issue #47, item #2).
#
# This is a SEPARATE crate with its own (empty) [workspace] table so it is
# fully detached from the parent workspace — `cargo build`/`cargo test` at the
# repo root never see it, and the nightly-only libfuzzer toolchain stays out of
# normal CI. Run targets with `cargo +nightly fuzz run <target>` from the repo
# root (requires `cargo install cargo-fuzz`). See README.md.
[package]
name = "did-hosting-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"

# The structure-aware targets need `Arbitrary` for the log-entry graph, which
# lives behind didwebvh-rs's off-by-default `arbitrary` feature (v0.5.5+).
didwebvh-rs = { version = "0.8", features = ["arbitrary"] }

# The crate under test. Default features (method-webvh + method-web) are enough
# for `did_ops`; server-core and the store/secret backends are not pulled in
# unless this crate's `server-core` feature is enabled (below).
did-hosting-common = { path = "../did-hosting-common" }

# Only for the `server-core` targets: names the `TrustTask<Value>` document
# type the listeners parse. Same requirement as the workspace's.
trust-tasks-rs = { version = "0.36.1", default-features = false, optional = true }

[features]
# The targets for code that exists only in server builds (the Trust Task
# envelope and size gate, the TSP binding, the URL-path validators, the
# wire-side witness-proof check). Run them with
# `cargo +nightly fuzz run --features server-core <target>`.
server-core = ["did-hosting-common/server-core", "dep:trust-tasks-rs"]

# Keep some debug info for useful crash backtraces without killing throughput.
[profile.release]
debug = 1

[[bin]]
name = "validate_did_jsonl"
path = "fuzz_targets/validate_did_jsonl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_did_log_proofs"
path = "fuzz_targets/verify_did_log_proofs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_did_log_proofs_structured"
path = "fuzz_targets/verify_did_log_proofs_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_did_id_matches_request"
path = "fuzz_targets/validate_did_id_matches_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_log_for_witnessing"
path = "fuzz_targets/verify_log_for_witnessing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_did_log_with_witness_proofs"
path = "fuzz_targets/verify_did_log_with_witness_proofs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_log_extends"
path = "fuzz_targets/verify_log_extends.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_metadata"
path = "fuzz_targets/log_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trust_task_envelope"
path = "fuzz_targets/trust_task_envelope.rs"
test = false
doc = false
bench = false
required-features = ["server-core"]

[[bin]]
name = "mnemonic"
path = "fuzz_targets/mnemonic.rs"
test = false
doc = false
bench = false
required-features = ["server-core"]

[[bin]]
name = "witness_proof_for_version"
path = "fuzz_targets/witness_proof_for_version.rs"
test = false
doc = false
bench = false
required-features = ["server-core"]
