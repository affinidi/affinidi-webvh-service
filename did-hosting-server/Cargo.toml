[package]
name = "did-hosting-server"
description = "DID Hosting Server, handles management and serving of WebVH Content"
version = "0.12.0"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
default = ["keyring", "store-fjall", "method-webvh", "method-web", "jemalloc"]
# Use jemalloc as the `did-hosting-server` binary's global allocator (see the
# dependency comment). On by default: with the system allocator the process
# holds its RSS high-water mark for its lifetime. Disable
# (`--no-default-features`) if you need to profile against the system allocator
# or are building for a target jemalloc doesn't support.
jemalloc = ["dep:tikv-jemallocator"]
metrics = ["did-hosting-common/metrics"]
keyring = ["did-hosting-common/keyring"]
# DID method routing (T25). Each method's resolve-side routes are
# gated behind its feature; the server fails to compile with no
# methods enabled (matches the common-crate behaviour at T31).
method-webvh = ["did-hosting-common/method-webvh"]
method-web = ["did-hosting-common/method-web"]
# Off by default: pulls the KERI stack, which an operator hosting no
# did:webs DIDs should not carry. Registers `/{*mnemonic}/keri.cesr` and
# claims `/{*mnemonic}/did.json` for did:webs records only.
method-webs = ["did-hosting-common/method-webs"]
aws-secrets = ["dep:aws-sdk-secretsmanager", "dep:aws-config", "did-hosting-common/aws-secrets"]
gcp-secrets = [
  "dep:google-cloud-secretmanager-v1",
  "dep:google-cloud-auth",
  "did-hosting-common/gcp-secrets",
]
azure-secrets = [
  "dep:azure_security_keyvault_secrets",
  "dep:azure_identity",
  "dep:azure_core",
  "dep:futures",
  "did-hosting-common/azure-secrets",
]
vault-secrets = ["did-hosting-common/vault-secrets"]
k8s-secrets = ["did-hosting-common/k8s-secrets"]
store-fjall = ["dep:fjall", "did-hosting-common/store-fjall"]
store-redis = ["dep:redis", "did-hosting-common/store-redis"]
store-dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-config", "did-hosting-common/store-dynamodb"]
store-firestore = ["dep:firestore", "dep:futures", "did-hosting-common/store-firestore"]
store-cosmosdb = ["dep:azure_data_cosmos", "dep:azure_core", "dep:futures", "did-hosting-common/store-cosmosdb"]
# Generate an OpenAPI 3.1 spec for the HTTP upload/resolve API (issue #47).
# Off by default — only the `openapi_snapshot` test and a doc-gen build need it.
# Requires method-webvh and method-web (both methods' resolve paths are
# documented).
openapi = ["dep:utoipa", "method-webvh", "method-web"]

[lib]
name = "did_hosting_server"
path = "src/lib.rs"

[[bin]]
name = "did-hosting-server"
path = "src/main.rs"

[dependencies]
did-hosting-common = { version = "0.12", path = "../did-hosting-common", features = ["server-core", "setup-wizard"] }
# OpenAPI spec generation (behind the off-by-default `openapi` feature).
utoipa = { version = "6", optional = true }
vti-common = { version = "0.66", default-features = false }
async-trait = { workspace = true }
affinidi-tdk = { workspace = true }
# Trust Tasks: the server consumes infrastructure trust tasks (health ping,
# register ack) so those ops are reachable over TSP as well as DIDComm.
# `trust-tasks-didcomm` is needed only for `ENVELOPE_TYPE`, the DIDComm message
# type that carries a trust-task document.
trust-tasks-rs = { workspace = true }
trust-tasks-didcomm = { workspace = true }
affinidi-messaging-didcomm-service = { workspace = true }
# TSP control-message type for `ServerTspHandler::handle_control`'s signature;
# the accept policy itself lives in `did_hosting_common::server::tsp_relationship`.
affinidi-tsp = { workspace = true }
affinidi-tdk-common = { workspace = true }
affinidi-messaging-didcomm = { workspace = true }
affinidi-secrets-resolver = { workspace = true }
tokio-util = { workspace = true }
affinidi-did-resolver-cache-sdk = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
base64 = { workspace = true }
bip39 = "3"
chrono = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
didwebvh-rs = { workspace = true }
url = { workspace = true }
ed25519-dalek = { workspace = true }
fjall = { workspace = true, optional = true }
hex = "0.4"
ipnetwork = "0.21"
jsonwebtoken = { workspace = true }
multibase = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }
vta-sdk = { workspace = true }
tower-http = { workspace = true, features = ["trace", "compression-gzip", "compression-br"] }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-config = { version = "1", features = [
  "behavior-version-latest",
], optional = true }

google-cloud-secretmanager-v1 = { version = "1", optional = true }
google-cloud-auth = { version = "1", optional = true }
bytes = "1"
redis = { version = "1.0", features = ["tokio-comp", "aio"], optional = true }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
firestore = { version = "0.61", optional = true }
futures = { version = "0.3", optional = true }
azure_data_cosmos = { version = "1", features = [
  "key_auth",
], optional = true }
azure_core = { version = "1.0", optional = true }
azure_security_keyvault_secrets = { version = "1.0", optional = true }
azure_identity = { version = "1.0", optional = true }

# ── Allocator ────────────────────────────────────────────────────────────
# jemalloc, used by the `did-hosting-server` binary only (set as the global
# allocator in main.rs — a library must never impose an allocator on its
# consumers).
#
# The default system allocator (glibc malloc on Linux) does not return the
# memory of freed allocations to the OS promptly. The edge's request path is a
# sawtooth of short-lived allocations (packed/unpacked DIDComm and TSP
# messages, DID logs read from the store, resolution responses), and glibc
# retains those arenas, so RSS ratchets up to its high-water mark and stays
# there. That reads as a leak in monitoring even though the live heap is flat.
# jemalloc's decay-based purging returns the pages, so RSS tracks live memory.
#
# Not available on MSVC; the cfg gate below falls back to the system allocator
# there.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# `tests/edge_trust_tasks.rs` checks every reply against the schema its type
# names.
trust-tasks-rs = { workspace = true, features = ["validate"] }
anyhow.workspace = true
# `tests/control_plane_ops.rs` signs control-plane documents with `did:key`
# signers and verifies them with the crate's local `DidKeyResolver`, so the
# proof checks run without DID-resolution I/O. It also asserts the claimed-
# issuer pre-check never reaches the resolver for a document that does not
# even claim to be the control plane, via a resolver double from
# `trust-tasks-proof`'s `ProofPurposeResolver` that panics if called.
affinidi-data-integrity = { workspace = true }
trust-tasks-proof = { workspace = true }
# `tests/webs_resolve.rs` re-derives the DID document from the served
# artifacts with the method crate directly, so the assertion is against
# an independent implementation rather than against the same code path
# that produced the response. Harmless when `method-webs` is off — the
# test file is `#![cfg]`-gated out.
affinidi-did-webs = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
ratatui = "0.30"
crossterm = "0.29"
reqwest = { workspace = true }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Adds `test-support` to the regular `did-hosting-common` dependency (Cargo
# unifies the two): a unit test resolves against a keyspace whose reads fail
# as a throttled store's would.
did-hosting-common = { path = "../did-hosting-common", features = ["server-core", "test-support"] }
