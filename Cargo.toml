[workspace]
members = [
  "did-hosting-client",
  "did-hosting-common",
  "did-hosting-control",
  "did-hosting-daemon",
  "did-hosting-server",
  "webvh-watcher",
  "webvh-witness",
]
# `fuzz/` is a detached cargo-fuzz crate with its own [workspace]; keep it out
# of the root workspace so normal builds never pull the nightly libfuzzer deps.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
description = "Affinidi DID Hosting Service. Collection of services to operate WebVH DID in production"
edition = "2024"
authors = ["Glenn Gore <glenn@affinidi.com>"]
readme = "README.md"
homepage = "https://affinidi.com/"
license = "Apache-2.0"
keywords = ["ssi", "affinidi", "webvh"]
repository = "https://github.com/affinidi/did-hosting-service"
publish = true
rust-version = "1.95.0"

[workspace.dependencies]

# Affinidi Trust Development Kit
# Moves in lockstep with vta-sdk / vti-common: vta-sdk 0.20 and vti-common
# 0.11.30 both depend on affinidi-tdk ^0.8, so all three resolve to a single
# affinidi-tdk copy. Drop back to 0.7 only if vta-sdk/vti-common ever re-pin.
affinidi-tdk = "0.8"
# `tsp` feature: routes inbound TSP frames on the shared mediator socket
# to the `TspHandler`. Without it the handler is stored but never invoked
# (the crate compiles TSP support out).
affinidi-messaging-didcomm-service = { version = "0.3", features = ["tsp"] }
affinidi-tdk-common = "0.6"
affinidi-messaging-didcomm = "0.15"
affinidi-secrets-resolver = "0.5"


# Cancellation token for DIDComm service
tokio-util = { version = "0.7", features = ["rt"] }

# Async runtime
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "signal",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 8785 JCS canonicalization. Used by the task-consent `payloadDigest`,
# which the spec defines over the canonical payload so the digest is stable
# across serializers on both sides of the approval.
serde_json_canonicalizer = "0.3"

# Error handling
thiserror = "2"

# Embedded key-value store
fjall = "3"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.10"

# Cryptography
# `ed25519-dalek` 3 and `sha2` 0.11 are chosen to sit on the *same* copy as the
# Affinidi stack we exchange keys and digests with, not merely because they are
# latest: affinidi-crypto / -data-integrity / -messaging-didcomm / -tsp,
# vta-sdk and vti-common are all on dalek 3, and didwebvh-rs / vta-sdk /
# vti-common on sha2 0.11. The only remaining dalek 2 in the lock is
# jsonwebtoken's own, which never crosses our API (we hand it DER/raw bytes —
# see `server::auth::jwt::JwtKeys::from_ed25519_bytes`).
ed25519-dalek = "3"
multibase = "0.9"
sha2 = "0.11"

# JWT — deliberately held at 10, not the latest 11. `trust-tasks-https`'s `jwt`
# feature and `vti-common` both pin ^10, so moving to 11 does not replace the
# old copy, it adds a second one *and* splits us from the JWT surface we hand
# tokens to. 11 also still depends on ed25519-dalek ^2, so it buys no
# consolidation there either. Revisit when trust-tasks-https moves.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Axum extras (typed headers for Bearer auth)
axum-extra = { version = "0.12", features = ["typed-header"] }

# Base64 encoding — held at 0.22, not the latest 0.23. Every Affinidi crate in
# the graph is on 0.22, so 0.23 would add a third copy (the AWS SDK already
# drags in 0.21) to gain nothing: base64 is pure encoding and crosses no API.
base64 = "0.22"

# WebAuthn / Passkey
webauthn-rs = { version = "0.5", features = [
  "danger-allow-state-serialisation",
] }
webauthn-rs-proto = "0.5"
url = "2"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Interactive prompts
dialoguer = "0.12"

# Static file embedding (for UI feature)
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"

# DID resolver
affinidi-did-resolver-cache-sdk = "0.8"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Error handling (lightweight)
anyhow = "1"

# DID WebVH
# Agent names (DID shortcuts) — parsing, canonicalisation and the
# alsoKnownAs verification rule. Shared with the resolver side so both
# normalise identically.
agent-names = "0.1.3"
didwebvh-rs = "0.6"

# VTA SDK — 0.21 on crates.io, bumped in lockstep with vti-common 0.11.35
# (which re-pins onto vta-sdk ^0.21 + affinidi-tdk ^0.8). Carries the canonical SIOPv2 /
# RFC 6749 wire types (`protocols::auth::{Session, TokenBundle,
# AuthenticateResponse, ChallengeResponse, epoch_to_rfc3339}`) that the
# cross-repo auth-architecture work introduced. vta-sdk and vti-common
# share these types and MUST move together — a mismatched pair resolves
# to two vta-sdk copies and fails to compile (E0308 on AuthenticateResponse).
# The four `vti-common = "0.11.35"` declarations in did-hosting-{common,
# control,server} and webvh-witness are the other half of that pin; move
# all five together. Verify afterwards with
# `cargo tree -d -e normal,build,dev`, which must list none of `vta-sdk`,
# `vti-common` or `affinidi-tdk` — the dev graph counts here too.
#
# The dev graph is the easy one to miss: `did-hosting-control` dev-depends on
# `affinidi-messaging-test-mediator`, which pulls `affinidi-messaging-mediator`,
# which pins vta-sdk itself. A test mediator pulling a mediator below 0.18.0
# pins vta-sdk ^0.20 and reintroduces the second copy behind a build that still
# passes, because the two copies never meet in one type-checking context. Keep
# the lock's `affinidi-messaging-mediator` at >= 0.18.4.
#
# `trust-tasks-rs` is the one duplicate the lock currently *does* carry, and
# it is expected: vta-sdk 0.21.9 / vti-common 0.11.35 still pin ^0.2, while we
# and the messaging stack (affinidi-messaging-sdk, -didcomm-service and
# -mediator) are on ^0.4. It compiles because neither vta-sdk nor
# vti-common exposes a trust-task type across its API to us — the two copies
# never meet in one type-checking context. Collapse it when the VTI side
# republishes on 0.4; until then do not "fix" it by dropping back to 0.2, which
# would instead split the messaging stack.
#
# `tsp` feature: enables the Trust Spanning Protocol client surface
# (`session::TspPingSession`, `atm.tsp().send/unpack`) that the TSP
# transport binding rides on. Pulls `affinidi-tdk/tsp` +
# `affinidi-messaging-sdk/tsp`.
vta-sdk = { version = "0.21", features = [
  "session",
  "provision-integration",
  "provision-client",
  "client",
  "tsp",
] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Trust Tasks (DTGWG, ToIP). On crates.io at 0.4.x. The whole family
# moves as one workspace event — `trust-tasks-rs`'s core types cross the
# public API of `-https` / `-didcomm` / `-proof` / `-tsp`, so a graph
# mixing majors does not type-check. Bump all five together, and in
# lockstep with verifiable-trust-infrastructure.
#
# What 0.2 → 0.4 changed for us:
#   * 0.3.0 — `TrustTask` gained `parent_thread_id` and `ErrorPayload`
#     gained `in_response_to`, so struct-literal construction of either
#     needs the new field (`TrustTask::new` / `for_payload` and
#     `ErrorPayload::new` are unaffected). Error responses are emitted as
#     `trust-task-error/0.3`, and `trust-tasks-didcomm` now sets the
#     DIDComm `thid` from the document's `threadId` (falling back to its
#     `id`), so a response continues its request's thread.
#   * 0.4.0 — digest-carrying payload members are the validating
#     `DigestMultibase` newtype rather than `String`. That covers
#     `task-consent/{request,decision,granted}`'s `payloadDigest`, which
#     we produce and verify: it is now a multibase-multihash over the
#     RFC 8785 canonicalization, not raw hex.
#
# The acl/* typed payloads we consume directly are still v0_1 in 0.4.x.
#
# `validate` feature: deliberately NOT enabled. The codegen-emitted
# `Payload` structs use `#[serde(deny_unknown_fields)]` plus newtype
# wrappers that reject `minLength: 1` / regex constraints at
# deserialise time, so we get framework-shape + payload-shape
# validation as a side-effect of typed dispatch. The `validate`
# feature would add JSON-Schema-driven validation against the
# embedded schema string per request — redundant for our consumers
# and a compile-time tax we don't pay. Re-enable if a future spec
# carries constraints not captured by the codegen newtypes.
trust-tasks-rs = { version = "0.4", default-features = false }
trust-tasks-https = { version = "0.4", default-features = false, features = ["server", "client", "jwt"] }
trust-tasks-didcomm = { version = "0.4", default-features = false }
trust-tasks-proof = { version = "0.4", default-features = false, features = ["affinidi"] }
# TSP (Trust Spanning Protocol, ToIP) transport binding for the Trust
# Tasks framework — the sibling of `trust-tasks-didcomm`, built on
# `affinidi-tsp`. Provides the `TransportHandler` impl + pack/unpack for
# TSP-delivered trust-task documents. Moves in lockstep with the rest of
# the `trust-tasks-*` family.
trust-tasks-tsp = { version = "0.4", default-features = false }
# Trust Spanning Protocol implementation for the Affinidi TDK. Consumed
# directly for the outbound TSP send path and VID/envelope helpers; also
# the crate `trust-tasks-tsp` is built on. `messaging-core` pulls the
# protocol-agnostic `affinidi-messaging-core` traits shared with DIDComm.
affinidi-tsp = { version = "0.1", features = ["messaging-core"] }
# Pinned to the same major.minor `trust-tasks-proof`'s `affinidi` feature
# resolves, so the lock keeps a single copy (avoids the crypto-stack diamond).
# Used directly by `did-hosting-common`'s `TransportBoundVerifier` for the
# signature-only-when-issuer-absent path.
affinidi-data-integrity = "0.7"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
