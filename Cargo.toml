[workspace]
members = [
  "did-hosting-client",
  "did-hosting-common",
  "did-hosting-control",
  "did-hosting-daemon",
  "did-hosting-server",
  "webvh-watcher",
  "webvh-witness",
]
# `fuzz/` is a detached cargo-fuzz crate with its own [workspace]; keep it out
# of the root workspace so normal builds never pull the nightly libfuzzer deps.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
description = "Affinidi DID Hosting Service. Collection of services to operate WebVH DID in production"
edition = "2024"
authors = ["Glenn Gore <glenn@affinidi.com>"]
readme = "README.md"
homepage = "https://affinidi.com/"
license = "Apache-2.0"
keywords = ["ssi", "affinidi", "webvh"]
repository = "https://github.com/affinidi/did-hosting-service"
publish = true
rust-version = "1.95.0"

[workspace.dependencies]

# Affinidi Trust Development Kit
# Moves in lockstep with vta-sdk / vti-common: vta-sdk 0.20 and vti-common
# 0.11.30 both depend on affinidi-tdk ^0.8, so all three resolve to a single
# affinidi-tdk copy. Drop back to 0.7 only if vta-sdk/vti-common ever re-pin.
affinidi-tdk = "0.10"
# `tsp` feature: routes inbound TSP frames on the shared mediator socket
# to the `TspHandler`. Without it the handler is stored but never invoked
# (the crate compiles TSP support out).
affinidi-messaging-didcomm-service = { version = "0.5", features = ["tsp"] }
affinidi-tdk-common = "0.6"
affinidi-messaging-didcomm = "0.15"
affinidi-secrets-resolver = "0.5"


# Cancellation token for DIDComm service
tokio-util = { version = "0.7", features = ["rt"] }

# Async runtime
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "signal",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 8785 JCS canonicalization. Used by the task-consent `payloadDigest`,
# which the spec defines over the canonical payload so the digest is stable
# across serializers on both sides of the approval.
serde_json_canonicalizer = "0.3"

# Error handling
thiserror = "2"

# Embedded key-value store
fjall = "3"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.10"

# Cryptography
# `ed25519-dalek` 3 and `sha2` 0.11 are chosen to sit on the *same* copy as the
# Affinidi stack we exchange keys and digests with, not merely because they are
# latest: affinidi-crypto / -data-integrity / -messaging-didcomm / -tsp,
# vta-sdk and vti-common are all on dalek 3, and didwebvh-rs / vta-sdk /
# vti-common on sha2 0.11. The only remaining dalek 2 in the lock is
# jsonwebtoken's own, which never crosses our API (we hand it DER/raw bytes —
# see `server::auth::jwt::JwtKeys::from_ed25519_bytes`).
ed25519-dalek = "3"
multibase = "0.9"
sha2 = "0.11"

# JWT — deliberately held at 10, not the latest 11. `trust-tasks-https`'s `jwt`
# feature and `vti-common` both pin ^10, so moving to 11 does not replace the
# old copy, it adds a second one *and* splits us from the JWT surface we hand
# tokens to. 11 also still depends on ed25519-dalek ^2, so it buys no
# consolidation there either. Revisit when trust-tasks-https moves.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Axum extras (typed headers for Bearer auth)
axum-extra = { version = "0.12", features = ["typed-header"] }

# Base64 encoding — held at 0.22, not the latest 0.23. Every Affinidi crate in
# the graph is on 0.22, so 0.23 would add a third copy (the AWS SDK already
# drags in 0.21) to gain nothing: base64 is pure encoding and crosses no API.
base64 = "0.22"

# WebAuthn / Passkey
webauthn-rs = { version = "0.5", features = [
  "danger-allow-state-serialisation",
] }
webauthn-rs-proto = "0.5"
url = "2"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Interactive prompts
dialoguer = "0.12"

# Static file embedding (for UI feature)
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"

# DID resolver
affinidi-did-resolver-cache-sdk = "0.8"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Error handling (lightweight)
anyhow = "1"

# DID WebVH
# Agent names (DID shortcuts) — parsing, canonicalisation and the
# alsoKnownAs verification rule. Shared with the resolver side so both
# normalise identically.
agent-names = "0.1.3"
didwebvh-rs = "0.6"

# DID webs — `did:web` discovery with KERI-verified key state.
#
# Taken WITHOUT the `create` feature on purpose. Creating a did:webs
# identifier means holding its KERI signing keys, and the hosting service
# never does: the controller (a VTA, or any external publisher) incepts and
# rotates, then publishes the resulting `keri.cesr` here. What this service
# needs is the other half — parse the stream, verify the key event log, and
# derive the document the log implies. That is the default feature set, and
# it keeps `affinidi-keri` (and its LMDB store) out of the dep graph.
affinidi-did-webs = "0.7"

# VTA SDK — 0.24 on crates.io, bumped in lockstep with vti-common 0.12
# (which re-pins onto vta-sdk ^0.24 + affinidi-tdk ^0.8). Carries the canonical SIOPv2 /
# RFC 6749 wire types (`protocols::auth::{Session, TokenBundle,
# AuthenticateResponse, ChallengeResponse, epoch_to_rfc3339}`) that the
# cross-repo auth-architecture work introduced. vta-sdk and vti-common
# share these types and MUST move together — a mismatched pair resolves
# to two vta-sdk copies and fails to compile (E0308 on AuthenticateResponse).
# The four `vti-common = "0.12"` declarations in did-hosting-{common,
# control,server} and webvh-witness are the other half of that pin; move
# all five together. Verify afterwards with
# `cargo tree -d -e normal,build`, which must list none of `vta-sdk`,
# `vti-common`, `affinidi-tdk` or `trust-tasks-rs`.
#
# The version requirement is a caret, so a plain `cargo update` floats
# vti-common to the newest compatible release on its own — and the newest
# re-pins onto a vta-sdk we do not ask for. Resolution does not fail when that
# happens: cargo just adds the second copy, and the report is three E0308s in
# `routes/auth.rs` naming two identical-looking `AuthenticateResponse` types.
# That is precisely what vti-common 0.11.38 (^0.22) and 0.11.39 (^0.23) did to
# a workspace still pinning vta-sdk ^0.21, and what 0.11.41 (^0.24) did on
# 2026-08-16 to one still pinning ^0.23. If you see that error, look at
# `cargo tree -d`, not at auth.rs. The `Upstream drift` canary exists to catch
# it a day early — it went red on 2026-08-13 for exactly this, one day before
# an operator's unlocked build hit it.
#
# Note what the 0.11.41 repeat teaches that the first one did not: the
# committed lockfile is the only thing holding the good pair, so the break is
# invisible to `cargo build` here and shows up first in an *unlocked* consumer
# build — `cargo install --path did-hosting-control` re-resolves unless you
# pass `--locked`. Deploy with `--locked`; that is the difference between
# shipping the pair we tested and shipping whatever crates.io published today.
#
# The dev graph used to be a separate question, and NOT clean: `did-hosting-control`
# dev-depends on `affinidi-messaging-test-mediator`, which pulled
# `affinidi-messaging-mediator` 0.18.11, which pinned vta-sdk ^0.21 — so
# `cargo tree -d -e normal,build,dev` showed vta-sdk 0.21.9 and, behind it,
# trust-tasks-rs 0.2.60. That was tolerated, not overlooked: neither copy crossed
# into a type-checking context of ours (the mediator is a test fixture we only
# spawn), and the alternative was holding our own SDK back to whatever the
# mediator last published against.
#
# **It collapsed once, then split again on the very next bump — which is the
# lesson.** The messaging stack republished on the trust-tasks 0.9 line
# (mediator 0.18.18 / test-mediator 0.2.51) and the dev graph went clean; moving
# the shipped graph to trust-tasks 0.17 immediately re-split it, because
# test-mediator was still pinned `^0.2` and dragged affinidi-tdk 0.8 /
# trust-tasks-rs 0.11 back in behind it. Bumping the dev-dep to
# `affinidi-messaging-test-mediator = "0.4"` (mediator 0.20, trust-tasks-rs
# 0.17) closed it again.
#
# So: this dev-dep is not independent of the trust-tasks family — it carries a
# copy, and it has to move in the same commit. `cargo tree -d -e
# normal,build,dev` must list none of `vta-sdk`, `vti-common`, `affinidi-tdk` or
# `trust-tasks-rs`; a dev-graph split is cheap to acquire and easy to stop
# noticing. Keep the lock's `affinidi-messaging-mediator` at >= 0.18.4
# regardless.
#
# `trust-tasks-rs` has now been duplicated in the *shipped* graph twice, and
# collapsed twice, by the same move: bring every crate that carries it onto one
# major. First when vta-sdk 0.21 / vti-common 0.11.35 pinned ^0.2 against our
# ^0.4 (the 0.23 bump closed it), then again on 0.4 → 0.6, where four
# transitive carriers had to move together (see the Trust Tasks block below).
# Do not "fix" a future split by dropping *back* a major — that splits the
# messaging stack instead of joining it.
#
# `tsp` feature: enables the Trust Spanning Protocol client surface
# (`session::TspPingSession`, `atm.tsp().send/unpack`) that the TSP
# transport binding rides on. Pulls `affinidi-tdk/tsp` +
# `affinidi-messaging-sdk/tsp`.
vta-sdk = { version = "0.31", features = [
  "session",
  "provision-integration",
  "provision-client",
  "client",
  "tsp",
] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Trust Tasks (DTGWG, ToIP). On crates.io at 0.9.x. The whole family
# moves as one workspace event — `trust-tasks-rs`'s core types cross the
# public API of `-https` / `-didcomm` / `-proof` / `-tsp`, so a graph
# mixing majors does not type-check. Bump all five together, and in
# lockstep with verifiable-trust-infrastructure.
#
# **"All five" undersells it.** `trust-tasks-rs` also arrives transitively
# through four crates we pin by caret, and every one of them has to reach a
# release on the same major or the shipped graph carries two copies:
# `vti-common`, `affinidi-messaging-sdk`, `affinidi-messaging-didcomm-service`
# and `trust-tasks-capability-client`. On the 0.4 → 0.6 move all four needed a
# lockfile update and nothing else — the requirements were already wide enough —
# but `cargo tree -d -e normal,build` is what tells you, and it listed
# trust-tasks-rs twice until the last of them moved. Run it; do not assume the
# five manifest lines were the whole job.
#
# What 0.6 → 0.9 changed for us:
#   * 0.7.0 — `StandardCode` became `#[non_exhaustive]`. Nothing here matches on
#     it, so no arm was needed. It is also the last time a new framework error
#     code will break a downstream `match`.
#   * 0.8.0 — added `StandardCode::Cancelled` and `trust-task-control/0.1`.
#     Additive in Rust, thanks to the attribute above.
#   * 0.9.0 — `consume_inbound` gained a REQUIRED `PayloadPolicy` argument
#     (SPEC §7.2 item 2), and `ValidatedPayload::SCHEMA_JSON` became
#     `Payload::PAYLOAD_SCHEMA`. We call `consume_inbound` through exactly one
#     shim (`did-hosting-common`'s `server::trust_tasks::run_pipeline`), so the
#     policy is decided there once for all ~28 call sites rather than threaded
#     through each. It is `AcceptUnvalidated` — see the note beside the
#     `validate` feature below, which gives the same reasoning. We used no
#     `SCHEMA_JSON`.
#   * The wire moved even though little source did: the framework now emits
#     `trust-task-error/0.5` (was `0.3`), because `0.4` added `idConflict` and
#     `0.5` added `cancelled`, neither of which validates against the older
#     payload schema's `code` enum. Our one hand-written copy of that version —
#     `framework_error_type_uri()`, for the unrouted paths where no request
#     document exists to reject from — had to move with it, and
#     `unrouted_and_routed_errors_agree_on_the_type_uri` is what caught it.
#     **That kind of drift is invisible to the compiler.** When bumping this
#     family, grep for `trust-task-error/0.` before trusting a green build.
#
# What 0.4 → 0.6 changed for us:
#   * 0.5.0 — `TrustTask<P>` gained an optional `ceremony` member (framework
#     0.4, SPEC §4.11), so struct-literal construction of the envelope needs
#     it. Four sites here, and they are not all the same: the three unrouted
#     body-parse error builders pass `None` (nothing parsed, so there is no
#     request to carry a ceremony from), while `messaging::tt_reply` builds a
#     *response* and must carry `request.ceremony.clone()` — SPEC §7.1 keeps a
#     reply inside the enactment its request belonged to, and `None` there
#     would silently drop it out.
#   * 0.6.0 — `DigestMultibase` narrowed to the two multibase headers CID §2.4
#     requires (`z` base58btc, `u` base64url-no-pad) and now enforces each
#     alphabet instead of assuming it. We mint base58btc, so nothing moved —
#     but a peer that had chosen `b`/`f`/`m` (the old pattern admitted them)
#     parses before this bump and fails after. `routes::task_consent` has a
#     test asserting the base; keep it.
#
# What 0.2 → 0.4 changed for us:
#   * 0.3.0 — `TrustTask` gained `parent_thread_id` and `ErrorPayload`
#     gained `in_response_to`, so struct-literal construction of either
#     needs the new field (`TrustTask::new` / `for_payload` and
#     `ErrorPayload::new` are unaffected). Error responses are emitted as
#     `trust-task-error/0.3`, and `trust-tasks-didcomm` now sets the
#     DIDComm `thid` from the document's `threadId` (falling back to its
#     `id`), so a response continues its request's thread.
#   * 0.4.0 — digest-carrying payload members are the validating
#     `DigestMultibase` newtype rather than `String`. That covers
#     `task-consent/{request,decision,granted}`'s `payloadDigest`, which
#     we produce and verify: it is now a multibase-multihash over the
#     RFC 8785 canonicalization, not raw hex.
#
# The acl/* typed payloads we consume directly are still v0_1 in 0.4.x.
#
# `validate` feature: deliberately NOT enabled. The codegen-emitted
# `Payload` structs use `#[serde(deny_unknown_fields)]` plus newtype
# wrappers that reject `minLength: 1` / regex constraints at
# deserialise time, so we get framework-shape + payload-shape
# validation as a side-effect of typed dispatch. The `validate`
# feature would add JSON-Schema-driven validation against the
# embedded schema string per request — redundant for our consumers
# and a compile-time tax we don't pay. Re-enable if a future spec
# carries constraints not captured by the codegen newtypes.
trust-tasks-rs = { version = "0.17", default-features = false }
trust-tasks-https = { version = "0.17", default-features = false, features = ["server", "client", "jwt"] }
trust-tasks-didcomm = { version = "0.17", default-features = false }
trust-tasks-proof = { version = "0.17", default-features = false, features = ["affinidi"] }
# TSP (Trust Spanning Protocol, ToIP) transport binding for the Trust
# Tasks framework — the sibling of `trust-tasks-didcomm`, built on
# `affinidi-tsp`. Provides the `TransportHandler` impl + pack/unpack for
# TSP-delivered trust-task documents. Moves in lockstep with the rest of
# the `trust-tasks-*` family.
trust-tasks-tsp = { version = "0.17", default-features = false }
# Trust Spanning Protocol implementation for the Affinidi TDK. Consumed
# directly for the outbound TSP send path and VID/envelope helpers; also
# the crate `trust-tasks-tsp` is built on. `messaging-core` pulls the
# protocol-agnostic `affinidi-messaging-core` traits shared with DIDComm.
affinidi-tsp = { version = "0.1", features = ["messaging-core"] }
# Pinned to the same major.minor `trust-tasks-proof`'s `affinidi` feature
# resolves, so the lock keeps a single copy (avoids the crypto-stack diamond).
# Used directly by `did-hosting-common`'s `TransportBoundVerifier` for the
# signature-only-when-issuer-absent path.
affinidi-data-integrity = "0.7"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
