# Resolve the graph with every feature on, as the CI `cargo deny` job (the
# cargo-deny action's default `--all-features`) does, so a local
# `cargo deny check` sees the same crates: the storage and cloud-secret
# backends are feature-gated, and several ignores below apply only to them.
[graph]
all-features = true

[advisories]
version = 2
# An ignore whose advisory no longer matches any crate is an error, not a
# warning: a stale entry would silently accept that advisory again if the
# crate came back. When a dependency update drops an advisory's crate, delete
# its ignore in the same PR.
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Marvin Attack on the `rsa` crate. Pulled in transitively by jsonwebtoken, but webvh JWTs use Ed25519 (EdDSA), so the RSA timing sidechannel is not on any code path we exercise." },
  # crypto-bigint 0.5.5 reaches us only through jsonwebtoken's `rust_crypto`
  # backend (elliptic-curve 0.13 -> p256/p384, for ES256/ES384). We sign and
  # verify EdDSA only (`server/auth/jwt.rs`), so no secret ever reaches that
  # arithmetic. The fix exists only in 0.7.6+; there is no patched 0.5.x, and
  # the 0.7 copy we resolve is 0.7.10. The ignore is by ID and also covers the
  # 0.7 line, so a downgrade below 0.7.6 there would be silenced.
  # Re-evaluate when jsonwebtoken moves to the elliptic-curve 0.14 line.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 — transitive via jsonwebtoken's p256/p384 only; our JWTs are EdDSA. No patched 0.5.x; our 0.7 copy is on 0.7.10." },
  # Unmaintained-status advisories on transitive crates. These are not
  # exploitable vulnerabilities — the upstreams that pull them haven't migrated
  # yet, and we don't depend on any of them directly. Revisit as the relevant
  # dependencies update. All three are reached only through feature-gated
  # backends, which is why `[graph] all-features` above matters.
  { id = "RUSTSEC-2024-0384", reason = "`instant` unmaintained — transitive only (no direct dependency); upstreams haven't migrated to web-time." },
  { id = "RUSTSEC-2025-0012", reason = "`backoff` unmaintained — transitive only (no direct dependency)." },
  { id = "RUSTSEC-2026-0441", reason = "`pin-utils` unmaintained — transitive only, via aws-smithy-{http,runtime,types}; no safe upgrade exists. Revisit when the AWS SDK moves to `pin-project-lite` / `std::pin::pin!`." },
  # Status-only "unmaintained" advisories (2026-11-17), no fixed release and no
  # reported vulnerability. chrono is used directly here and through the
  # affinidi-tdk stack, so it cannot leave the graph from this repo alone.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (chronotope/chrono#1768): status only, no vulnerability, no fixed release. Used directly and through the affinidi-tdk stack. Remove when this workspace and affinidi-tdk-rs have migrated to `jiff` or `time`." },
  { id = "RUSTSEC-2026-0542", reason = "humantime marked unmaintained because chrono is: status only, no vulnerability; humantime 2.4.0 has no dependencies, so chrono's status does not reach it. Remove with RUSTSEC-2026-0543, or when nothing here depends on humantime." },
]
# Removed with the vta-sdk 0.21 / vti-common 0.11.33 bump, which dropped the
# whole `ssi-*` / `json-ld` subtree and the old `proc-macro-error` generation:
#   RUSTSEC-2024-0370 (proc-macro-error), RUSTSEC-2026-0173 (proc-macro-error2),
#   RUSTSEC-2026-0215 (smallstr) — none of those crates are in the lock any more.
# Removed by the workspace-wide `cargo update` in this release, which dropped
# `rustls-pemfile` from the lock entirely:
#   RUSTSEC-2025-0134 (rustls-pemfile unmaintained).
# Removed once the AWS SDK's legacy TLS stack (hyper 0.14 / hyper-rustls 0.24)
# left the lock; only rustls 0.23.46, rustls-webpki 0.103.16 and h2 0.4.20
# remain, each at or above its advisory's fixed version:
#   RUSTSEC-2026-0098, -0099, -0104, -0382 (rustls-webpki 0.101.7),
#   RUSTSEC-2026-0258 (h2 0.3.27), RUSTSEC-2026-0346, -0349 (rustls 0.21.12).

[bans]
# Duplicate versions warn rather than fail: every duplicate below is pulled by
# an upstream we do not control, so a hard ban would only make the job red
# until those upstreams move. The skip list names the *older* copy of each one
# known today, so a new duplicate (or a third copy of one of these) still shows
# up as a warning in the `cargo deny` job log. When a dependency update drops a
# duplicate, cargo-deny reports its skip entry as unused — delete it then.
#
# None of these is dedupable from this workspace (checked with
# `cargo tree -i <crate>@<ver>` and `cargo update --dry-run`): every older copy
# is reached only through a third-party crate's own requirement.
multiple-versions = "warn"
skip = [
  # RustCrypto's 2024-25 release generation (digest 0.10 -> 0.11, signature 2
  # -> 3, elliptic-curve 0.13 -> 0.14, ed25519-dalek 2 -> 3, ...). We and the
  # Affinidi stack are on the new generation; jsonwebtoken (both majors),
  # webauthn-rs, the KERI stack (argon2 0.5) and the cloud SDKs
  # are still on the old one.
  "aead@0.5.2",
  "aes@0.8.4",
  "argon2@0.5.3",
  "base16ct@0.2.0",
  "blake2@0.10.6",
  "block-buffer@0.10.4",
  "block-padding@0.3.3",
  "cbc@0.1.2",
  "cipher@0.4.4",
  "const-oid@0.9.6",
  "cpufeatures@0.2.17",
  "crypto-bigint@0.5.5",
  "crypto-common@0.1.7",
  "curve25519-dalek@4.1.3",
  "der@0.7.10",
  "digest@0.10.7",
  "ecdsa@0.16.9",
  "ed25519@2.2.3",
  "ed25519-dalek@2.2.0",
  "elliptic-curve@0.13.8",
  "ff@0.13.1",
  "fiat-crypto@0.2.9",
  "group@0.13.0",
  "hkdf@0.12.4",
  "hmac@0.12.1",
  "inout@0.1.4",
  "num-bigint@0.4.8",
  "p256@0.13.2",
  "p384@0.13.1",
  "password-hash@0.5.0",
  "pem-rfc7468@0.7.0",
  "pkcs8@0.10.2",
  "poly1305@0.8.0",
  "primeorder@0.13.6",
  "rfc6979@0.4.0",
  "salsa20@0.10.2",
  "sec1@0.7.3",
  "sha1@0.10.7",
  "sha2@0.10.9",
  "signature@2.2.0",
  "spki@0.7.3",
  "universal-hash@0.5.1",
  # rand 0.8 / 0.9 / 0.10 and their cores: the same generational split.
  "getrandom@0.2.17",
  "getrandom@0.3.4",
  "r-efi@5.3.0",
  "rand@0.8.8",
  "rand@0.9.5",
  "rand_chacha@0.3.1",
  "rand_core@0.6.4",
  "rand_core@0.9.5",
  # base64: 0.21 under webauthn-rs, 0.22 under `headers` / jsonwebtoken (see
  # the note on `base64` in Cargo.toml).
  "base64@0.21.7",
  "base64@0.22.1",
  # jsonwebtoken 10 is ours, 11 arrives with vti-common / the mediator /
  # google-cloud-auth (see the note on `jsonwebtoken` in Cargo.toml).
  "jsonwebtoken@10.4.0",
  # tower-http 0.6 via reqwest 0.13 and kube-client; we are on 0.7.
  "tower-http@0.6.11",
  # tokio-tungstenite / tungstenite 0.29 via axum 0.8's `ws`; the messaging
  # SDK is on 0.30.
  "tokio-tungstenite@0.29.0",
  "tungstenite@0.29.0",
  # serde_json_canonicalizer 0.3 via affinidi-data-integrity 0.8.
  "serde_json_canonicalizer@0.3.2",
  # thiserror 1 via asn1-rs / x509-parser (webauthn-rs) and vaultrs.
  "thiserror@1.0.69",
  "thiserror-impl@1.0.69",
  # Proc-macro and std-adjacent generations pulled by assorted upstreams.
  "convert_case@0.10.0",
  "core-foundation@0.9.4",
  "darling@0.20.11",
  "darling_core@0.20.11",
  "darling_macro@0.20.11",
  "hashbrown@0.14.5",
  "hashbrown@0.16.1",
  "syn@1.0.109",
  "syn@2.0.119",
  "synstructure@0.12.6",
  "synstructure@0.13.2",
  # untrusted 0.7 via aws-lc-rs; ring is on 0.9.
  "untrusted@0.7.1",
]

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "CC0-1.0",
  "ISC",
  "MIT-0",
  "MIT",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # As stated here https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html#spdx-identifiers
  # 3.11 versions of SPDX License List was used and below licenses are not included there.
  # They are commented to avoid "[license-not-encountered]" warnings.
  #    "Apache-1.1",
  #    "WTFPL",
  #    "Fair",
  #    "Intel",
  #    "MIT-Modern-Variant",
  #    "MulanPSL-2.0",
  #    "Multics",
  #    "Naumen",
  #    "PHP-3.01",
  #    "PostgreSQL",
  #    "Python-2.0",
  #    "OFL-1.1",
  #    "MirOS",
  #    "UPL-1.0",
  #    "Unicode-DFS-2016",
  #    "AFL-2.1",
]

exceptions = [
  # `bitmaps` / `im` / `sized-chunks` (MPL-2.0, CC-BY-SA-3.0) dropped out of the
  # graph with the `ssi-*` subtree — see the advisories note above.
  { allow = ["MPL-2.0"], crate = "webauthn-rs" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs-core" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs-proto" },
  { allow = ["MPL-2.0"], crate = "webauthn-attestation-ca" },
  { allow = ["MPL-2.0"], crate = "base64urlsafedata" },
  # `option-ext` arrived with vta-sdk 0.31, which took a `dirs` dependency
  # (dirs -> dirs-sys -> option-ext). MPL-2.0 is file-level copyleft and the
  # crate is consumed unmodified as a library, like the webauthn-rs entries
  # above.
  { allow = ["MPL-2.0"], crate = "option-ext" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

# Sigh
[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
