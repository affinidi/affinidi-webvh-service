name: Tag a release

# A push to a release branch that moves RELEASE (the cut, or a merged prep PR)
# tags `v<RELEASE>` and opens its GitHub Release (RELEASES.md). An rc is a
# prerelease. Its notes are the version's CHANGELOG.md section where it has
# one, otherwise generated.
#
# Tagged as the release bot: the org's tag ruleset lets only it create tags.
# Crates are published by hand from the tag (RELEASES.md, "Publish").
on:
  push:
    branches: ["release/**"]
    paths: [RELEASE]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag v<RELEASE>
    # RELEASE_BOT_PRIVATE_KEY is a secret of this environment.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: affinidi/pipeline-rust/.github/actions/release-tag@feat/release-branch-actions
        with:
          token: ${{ steps.app.outputs.token }}
