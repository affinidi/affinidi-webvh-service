name: Nightly

# Advances `nightly` to the newest main commit whose full CI run passed
# (RELEASES.md). main merges on a red suite as readily as a green one, so its
# tip is not something to cut a release from; `nightly` is: a fast-forward-only
# pointer that moves only to a commit every ci.yml job passed on.
#
# Moved with RELEASE_TOKEN when it is set, so a ruleset can restrict `nightly`
# to that identity; GITHUB_TOKEN works otherwise (nothing triggers on a push to
# `nightly`, so the token's no-workflows rule costs nothing here).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  advance:
    name: Advance nightly to the last green main
    runs-on: ubuntu-latest
    # The nightly ruleset lets only the release bot move nightly.
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: affinidi/pipeline-rust/.github/actions/release-nightly@feat/release-branch-actions
        with:
          token: ${{ steps.app.outputs.token }}
