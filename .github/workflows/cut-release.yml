name: Cut a release

# Creates `release/<major.minor>` from `nightly` and opens the `release-cut/…`
# PR that moves main to the next minor (RELEASES.md, "Cut"). Run it from the
# Actions tab on main. The push to the release branch triggers release-tag.yml,
# which tags `v<major.minor>.0-rc.0` straight away; only the release-cut PR
# waits for a merge.
#
# It runs scripts/cut-release.py as the release-bot app (affinidi-semantic-
# release). The `release/*` ruleset restricts branch creation and requires
# signatures, and lets admins bypass it only through a PR, which a new branch
# cannot come from, so an admin can no longer push a cut from a laptop; the
# app bypasses it. Because the app can, the job first checks that whoever
# started the run is an admin, keeping "only admins cut a release".
on:
  workflow_dispatch:
    inputs:
      release:
        description: "major.minor to cut, e.g. 0.12"
        required: true
        type: string
      from:
        description: "Source revision (default: the newest green main, origin/nightly)"
        required: false
        default: origin/nightly
        type: string
      dry_run:
        description: "Build both commits and show them; push nothing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut release/${{ inputs.release }}${{ inputs.dry_run && ' (dry run)' || '' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # RELEASE_BOT_PRIVATE_KEY is a secret of this environment.
    environment: release
    timeout-minutes: 30
    steps:
      - name: Check the inputs
        env:
          RELEASE: ${{ inputs.release }}
          FROM: ${{ inputs.from }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::release must be major.minor, not '$RELEASE'"; exit 1; }
          # A ref name or a full commit id; never something git could read as an option.
          [[ "$FROM" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$FROM" != *..* ]] \
            || { echo "::error::from must be a ref name or commit id, not '$FROM'"; exit 1; }
      # The release-bot app is on the release-branch and tag bypass lists and
      # may open PRs; GITHUB_TOKEN is neither.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Only an admin may cut
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          role=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission)
          [[ "$role" == "admin" ]] || { echo "::error::${ACTOR} is '${role}' on ${REPO}; only an admin may cut a release"; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The worktrees need the source commit, and the changelog orders
          # entries by when each fragment was added: the whole history.
          fetch-depth: 0
          persist-credentials: false
      # `cargo update` refreshes both lockfiles after the versions move.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cut
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          RELEASE: ${{ inputs.release }}
          FROM: ${{ inputs.from }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Commit and sign off as the app that pushes.
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          # The app token for this step's git only: held in the environment,
          # not written to .git/config where later steps could read it.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          args=("$RELEASE" --from "$FROM")
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          python3 scripts/cut-release.py "${args[@]}"
