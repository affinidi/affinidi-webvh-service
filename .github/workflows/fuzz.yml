name: Fuzz

# Coverage-guided fuzzing of the `did_ops` validators (issue #47).
#
# cargo-fuzz needs the nightly toolchain and builds the libfuzzer runtime, so
# this is kept OUT of PR CI — it runs on a nightly cron (and on demand) instead.
# A regression that slips past PR review is caught within a day rather than
# adding minutes + nightly flakiness to every pull request.
on:
  schedule:
    # 03:17 UTC daily (off the top of the hour to dodge scheduler congestion).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        required: false
        default: "300"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz defaults its build target to x86_64-unknown-linux-musl on Linux,
  # but the toolchain step only installs the host (gnu) std, so the musl build
  # fails with `error[E0463]: can't find crate for core` before any fuzzing runs.
  # Pin the target to the pre-installed gnu host (matches tdk-rs fuzz.yaml). Do
  # not remove without also adding `targets: x86_64-unknown-linux-musl` above.
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
  # Per-target wall-clock budget. The cron run uses the default; a manual
  # dispatch can override it.
  MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '300' }}

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - validate_did_jsonl
          - verify_did_log_proofs
          - verify_did_log_proofs_structured
          - validate_did_id_matches_request
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly

      # Cache the detached fuzz crate's build artifacts keyed on its own lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-fuzz

      - name: Fuzz ${{ matrix.target }} for ${{ env.MAX_TOTAL_TIME }}s
        run: |
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time="${{ env.MAX_TOTAL_TIME }}" \
            -print_final_stats=1

      # On a crash, libfuzzer writes a reproducer to fuzz/artifacts/. Preserve
      # it so the failure can be reproduced locally with
      # `cargo +nightly fuzz run <target> fuzz/artifacts/<target>/<file>`.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
