name: Backport

# A merged PR labelled `backport release/<major.minor>` is cherry-picked onto
# that release branch as a new PR (RELEASES.md: fix on main first, then
# backport). Add the label before or after merging; one label per branch.
#
# CHANGELOG.md never conflicts: the release branch's copy is kept (main's
# `## Unreleased` is not on the branch, and the patch's changelog is generated
# from commit subjects). Any other conflict fails the push — the action commits
# it as `BACKPORT-CONFLICT`, which the commit-message rule rejects — and the
# action comments on the source PR; backport it by hand on a branch named
# `backport-<pr>-to-release/<name>`.
#
# pull_request_target, so it runs with this repository's secrets even for a PR
# from a fork. It checks out no PR code to run: the action only cherry-picks
# the commits a maintainer already merged. The PR is opened with the release
# bot app: `branch rules` accepts a backport only from it, and a PR opened
# with GITHUB_TOKEN would run no CI.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: read

jobs:
  backport:
    name: Backport
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'backport '))
    runs-on: ubuntu-latest
    # RELEASE_BOT_PRIVATE_KEY is a secret of this environment.
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      # Every backport conflicts on CHANGELOG.md, and the fix is always the same:
      # keep the release branch's copy ("ours" during a cherry-pick). Global, as
      # the action makes its own checkout.
      - name: Keep the release branch's CHANGELOG.md when cherry-picking
        run: |
          git config --global merge.keep-release-changelog.driver true
          echo "CHANGELOG.md merge=keep-release-changelog" > "$RUNNER_TEMP/backport.gitattributes"
          git config --global core.attributesFile "$RUNNER_TEMP/backport.gitattributes"
      - uses: affinidi/pipeline-rust/.github/actions/release-backport@feat/release-branch-actions
        with:
          token: ${{ steps.app.outputs.token }}
