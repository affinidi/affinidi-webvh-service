name: Backport

# A merged PR labelled `backport release/<major.minor>` is cherry-picked onto
# that release branch as a new PR (RELEASES.md: fix on main first, then
# backport). Add the label before or after merging; one label per branch.
#
# Changelog notes stay on main: a patch's changelog is generated from the
# commit subjects it ships. CHANGELOG.md never conflicts: the release branch's
# copy is kept. And once the backport PRs exist, the last step removes from
# each the `changelog.d/` fragments it adds (and any CHANGELOG.md change the
# cherry-pick still made), in one signed-off commit.
#
# Any other conflict fails the push — the action commits
# it as `BACKPORT-CONFLICT`, which the commit-message rule rejects — and the
# action comments on the source PR; backport it by hand on a branch named
# `backport-<pr>-to-release/<name>`.
#
# pull_request_target, so it runs with this repository's secrets even for a PR
# from a fork. It checks out no PR code to run: the action only cherry-picks
# the commits a maintainer already merged. The PR is opened with the release
# bot app: `branch rules` accepts a backport only from it, and a PR opened
# with GITHUB_TOKEN would run no CI.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: read

jobs:
  backport:
    name: Backport
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'backport '))
    runs-on: ubuntu-latest
    # RELEASE_BOT_PRIVATE_KEY is a secret of this environment.
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app.outputs.token }}
      # Every backport conflicts on CHANGELOG.md (main's `## Unreleased` is not
      # on a GA'd branch), and the fix is always the same: keep the release
      # branch's copy. Do that in the cherry-pick itself. Left to the action, a
      # conflict is committed as `BACKPORT-CONFLICT`, which the repository's
      # commit-message rule rejects, so the push fails and no PR is opened.
      # A merge driver of `true` keeps "ours", which during a cherry-pick is the
      # release branch.
      - name: Keep the release branch's CHANGELOG.md when cherry-picking
        run: |
          git config merge.keep-release-changelog.driver true
          echo "CHANGELOG.md merge=keep-release-changelog" >> "$(git rev-parse --git-path info/attributes)"
      - uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4.7.0
        id: backport
        with:
          github_token: ${{ steps.app.outputs.token }}
          label_pattern: '^backport (release/\d+\.\d+)$'
          pull_title: '${pull_title}'
          pull_description: |-
            Backport of #${pull_number} to `${target_branch}`.

            ${pull_description}
          add_labels: backport
          copy_assignees: true
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
      - name: Drop changelog notes from the backport PRs
        if: steps.backport.outputs.created_pull_numbers != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CREATED: ${{ steps.backport.outputs.created_pull_numbers }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in $CREATED; do
            read -r head base < <(gh pr view "$n" --json headRefName,baseRefName \
              --jq '.headRefName + " " + .baseRefName')
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/$base:refs/remotes/origin/$base" \
              "+refs/heads/$head:refs/remotes/origin/$head"
            git switch -q --detach "origin/$head"
            # Fragments the backport adds (the base's own, kept from before its
            # GA, are not in this list), README excepted.
            mapfile -t added < <(git diff --name-only --diff-filter=A "origin/$base" HEAD -- \
              'changelog.d/*.md' ':(exclude)changelog.d/README.md')
            if [ "${#added[@]}" -gt 0 ]; then
              git rm -q -- "${added[@]}"
            fi
            if ! git diff --quiet "origin/$base" HEAD -- CHANGELOG.md; then
              git checkout "origin/$base" -- CHANGELOG.md
            fi
            if git diff --cached --quiet; then
              echo "#$n: no changelog notes to drop"
              continue
            fi
            git commit -q -s -m "chore(backport): drop changelog notes; a patch's notes come from commit subjects"
            git push -q origin "HEAD:refs/heads/$head"
            echo "#$n: dropped changelog notes from $head"
          done
