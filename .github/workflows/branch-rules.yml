name: Branch rules

# Where a PR may go and what it may change: fixes reach a release branch by
# backport, only the release tooling edits versions, RELEASE and CHANGELOG.md
# (RELEASES.md).
#
# Its own workflow for the trigger: `labeled` / `unlabeled` must re-run it (the
# `release-direct` label changes the verdict), and adding those to ci.yml would
# rebuild the world on every label. Seconds, no build.
on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read  # who added release-direct

jobs:
  rules:
    name: branch rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned: this action decides what may reach main and release/**.
      - uses: affinidi/pipeline-rust/.github/actions/release-branch-rules@9f2e1cbce584c217931ddbed131c2967ec4eb9cd # main, 2026-11-17
        with:
          # Transitional: maintainers may still cut or prep locally; drop once
          # both use the release workflows (and MAINTAINER_RELEASES below).
          maintainer-releases: "true"
      # What the shared check cannot hold here (scripts/check-branch-rules.py):
      # the version rules, since each crate carries its own `version` and the
      # shared check reads only `[workspace.package]`, and the CHANGELOG.md
      # rule. Checked out here too, rather than relying on what the shared
      # action leaves in the workspace.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Local branch rules
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          MAINTAINER_RELEASES: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-branch-rules.py
