name: Prepare a release

# Opens the PR that prepares the next rc, GA or patch of a release
# (RELEASES.md). Run it from the Actions tab with the release branch selected
# as the ref. Merging the PR it opens is the release: release-tag.yml tags it.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "rc (next candidate), ga (rc.N -> .0) or patch (.N -> .N+1)"
        required: true
        type: choice
        options: [patch, rc, ga]

permissions:
  contents: read

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.kind }} on ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Tags: a patch's changelog is the commits since the last `v…` tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Bump versions, write the changelog, move RELEASE
        env:
          KIND: ${{ inputs.kind }}
        run: python3 scripts/prepare-release.py --kind "$KIND" --pr-body "$RUNNER_TEMP/body.md"
      - name: Open the PR
        env:
          # RELEASE_TOKEN: the enterprise does not allow GITHUB_TOKEN to open
          # pull requests, and one it opened would run no CI (RELEASES.md).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          BASE: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target=$(cat RELEASE)
          head="release-prep/${BASE#release/}/$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$head"
          git add -A
          git commit -s -m "chore(release): v$target"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$head"
          gh pr create --base "$BASE" --head "$head" --title "chore(release): v$target" \
            --body-file "$RUNNER_TEMP/body.md"
