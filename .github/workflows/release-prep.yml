name: Prepare a release

# Opens the PR that prepares the next rc, GA or patch of a release
# (RELEASES.md). Run it from the Actions tab with the release branch selected
# as the ref. Merging the PR it opens is the release: release-tag.yml tags it.
#
# The PR is opened with the release bot app: `branch rules` accepts a prep PR
# only from it, and a PR opened with GITHUB_TOKEN would run no CI.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "rc (next candidate), ga (rc.N -> .0) or patch (.N -> .N+1)"
        required: true
        type: choice
        options: [patch, rc, ga]

permissions:
  contents: read

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.kind }} on ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    # RELEASE_BOT_PRIVATE_KEY is a secret of this environment.
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: affinidi/pipeline-rust/.github/actions/release-prep@feat/release-branch-actions
        with:
          kind: ${{ inputs.kind }}
          token: ${{ steps.app.outputs.token }}
      # The action leaves the prep branch checked out; a patch also moves the
      # version the OpenAPI snapshot and fuzz/Cargo.lock record.
      - name: Carry the version into docs/openapi.json and fuzz/Cargo.lock
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/sync-version-files.py
          git add docs/openapi.json fuzz/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          head=$(git branch --show-current)
          git commit -s -m "chore(release): v$(cat RELEASE) in docs/openapi.json and fuzz/Cargo.lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${head}"
