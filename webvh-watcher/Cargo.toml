[package]
name = "webvh-watcher"
description = "WebVH Watcher, read-only DID mirror service"
version = "0.12.0"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
default = ["keyring", "store-fjall", "jemalloc"]
# Use jemalloc as the `webvh-watcher` binary's global allocator (see the
# dependency comment). On by default: with the system allocator the process
# holds its RSS high-water mark for its lifetime. Disable
# (`--no-default-features`) if you need to profile against the system allocator
# or are building for a target jemalloc doesn't support.
jemalloc = ["dep:tikv-jemallocator"]
keyring = ["did-hosting-common/keyring"]
aws-secrets = ["did-hosting-common/aws-secrets"]
gcp-secrets = ["did-hosting-common/gcp-secrets"]
azure-secrets = ["did-hosting-common/azure-secrets"]
vault-secrets = ["did-hosting-common/vault-secrets"]
k8s-secrets = ["did-hosting-common/k8s-secrets"]
store-fjall = ["did-hosting-common/store-fjall"]
store-redis = ["did-hosting-common/store-redis"]
store-dynamodb = ["did-hosting-common/store-dynamodb"]
store-firestore = ["did-hosting-common/store-firestore"]
store-cosmosdb = ["did-hosting-common/store-cosmosdb"]

[lib]
name = "webvh_watcher"
path = "src/lib.rs"

[[bin]]
name = "webvh-watcher"
path = "src/main.rs"

[dependencies]
did-hosting-common = { version = "0.12", path = "../did-hosting-common", features = ["server-core", "setup-wizard"] }
affinidi-did-resolver-cache-sdk = { workspace = true }
affinidi-messaging-didcomm = { workspace = true }
affinidi-messaging-didcomm-service = { workspace = true }
affinidi-tdk = { workspace = true }
affinidi-tsp = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio-util = { workspace = true }
trust-tasks-rs = { workspace = true }
trust-tasks-didcomm = { workspace = true }
uuid = { workspace = true }
vta-sdk = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ── Allocator ────────────────────────────────────────────────────────────
# jemalloc, used by the `webvh-watcher` binary only (set as the global
# allocator in main.rs — a library must never impose an allocator on its
# consumers).
#
# The default system allocator (glibc malloc on Linux) does not return the
# memory of freed allocations to the OS promptly. The watcher's request path is
# a sawtooth of short-lived allocations (DID logs mirrored from their sources,
# resolution responses), and glibc retains those arenas, so RSS ratchets up to
# its high-water mark and stays there. That reads as a leak in monitoring even
# though the live heap is flat. jemalloc's decay-based purging returns the
# pages, so RSS tracks live memory.
#
# Not available on MSVC; the cfg gate below falls back to the system allocator
# there.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
affinidi-data-integrity = { workspace = true }
affinidi-secrets-resolver = { workspace = true }
didwebvh-rs = { workspace = true }
http-body-util = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
trust-tasks-proof = { workspace = true }
trust-tasks-rs = { workspace = true, features = ["validate"] }
