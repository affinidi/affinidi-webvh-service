[package]
name = "did-hosting-control"
description = "DID Hosting Control Plane — Unified management UI and service registry"
version = "0.8.8"
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"
# `ui-dist/` is a build artifact (gitignored, produced by `npm run build:web`
# via build.rs) but it MUST ship in the published tarball: the crate embeds it
# with rust-embed, and `../did-hosting-ui` is a workspace sibling that
# `cargo package` never collects. An explicit `include` is what overrides the
# gitignore — which is also why publishing this crate needs
# `cargo publish --allow-dirty` (cargo counts the untracked bundle as dirty).
include = [
  "src/**/*",
  "tests/**/*",
  "ui-dist/**/*",
  "build.rs",
  "README.md",
]

[features]
default = ["keyring", "store-fjall", "ui"]
metrics = ["did-hosting-common/metrics"]
# DID methods the control plane can accept publications for. The control
# plane is the write side, so a method must be enabled here for
# register/publish to verify and store it — enabling it only on the
# server would serve a method nothing can put in the store.
#
# webvh and web need no feature here: their write paths predate the
# method abstraction and are always compiled. webs is opt-in for the
# same reason as everywhere else — it pulls the KERI stack.
method-webs = ["did-hosting-common/method-webs"]
ui = ["dep:rust-embed", "dep:mime_guess"]
keyring = ["did-hosting-common/keyring"]
aws-secrets = ["dep:aws-sdk-secretsmanager", "dep:aws-config", "did-hosting-common/aws-secrets"]
gcp-secrets = [
  "dep:google-cloud-secretmanager-v1",
  "dep:google-cloud-auth",
  "dep:bytes",
  "did-hosting-common/gcp-secrets",
]
azure-secrets = [
  "dep:azure_security_keyvault_secrets",
  "dep:azure_identity",
  "dep:azure_core",
  "dep:futures",
  "did-hosting-common/azure-secrets",
]
vault-secrets = ["did-hosting-common/vault-secrets"]
k8s-secrets = ["did-hosting-common/k8s-secrets"]
store-fjall = ["dep:fjall", "did-hosting-common/store-fjall"]
store-redis = ["dep:redis", "did-hosting-common/store-redis"]
# In-process test harness (`TestServer`) for this crate's own integration tests
# and for downstream consumers that want to cover a control-plane path without
# hand-assembling `AppState`. Enable via a `[dev-dependencies]` `features =
# ["test-support"]` entry. Off by default — never compiled into a release.
test-support = ["dep:tempfile"]
store-dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-config", "did-hosting-common/store-dynamodb"]
store-firestore = ["dep:firestore", "dep:futures", "did-hosting-common/store-firestore"]
store-cosmosdb = ["dep:azure_data_cosmos", "dep:azure_core", "dep:futures", "did-hosting-common/store-cosmosdb"]
# NOTE: passkey/WebAuthn is always compiled into the control plane — it is
# enabled unconditionally via the `did-hosting-common` dependency below
# (`features = [... "passkey" ...]`) and `webauthn-rs` is a non-optional
# dependency. There is intentionally no `passkey` feature here: the routes,
# AppState, and `build_webauthn` are wired without any cfg gate. The real
# on/off switch is runtime config — WebAuthn is only initialised when
# `public_url` is set; otherwise DID challenge/response auth is used.

[lib]
name = "did_hosting_control"
path = "src/lib.rs"

[[bin]]
name = "did-hosting-control"
path = "src/main.rs"

[dependencies]
agent-names = { workspace = true }
did-hosting-common = { version = "0.8", path = "../did-hosting-common", features = ["server-core", "passkey", "setup-wizard"] }
# vti-common consumed transitively via did-hosting-common, but
# this crate also references `vti_common::auth::handlers::*` +
# `AuthenticateInput` directly when dispatching to canonical
# /auth/* handlers. Pinned to the same minor as the other three
# declarations (did-hosting-common/-server, webvh-witness) and to
# the workspace `vta-sdk = "0.24"` — see the lockstep note in
# did-hosting-common/Cargo.toml.
vti-common = { version = "0.12", default-features = false }
async-trait = "0.1"
# Trust Tasks framework — used by routes/trust_tasks.rs (the
# /api/trust-tasks endpoint introduced in v0.7.1).
trust-tasks-rs = { workspace = true }
trust-tasks-https = { workspace = true }
trust-tasks-didcomm = { workspace = true }
trust-tasks-proof = { workspace = true }
chrono = { workspace = true }
# Direct dep for signing the request leg of outbound approval Trust Tasks
# (task-consent/request, auth/step-up/approve-request) with the control DID's
# assertion key — see src/signing.rs and issue #147.
affinidi-data-integrity = { workspace = true }
affinidi-tdk = { workspace = true }
affinidi-messaging-didcomm-service = { workspace = true }
affinidi-tdk-common = { workspace = true }
affinidi-messaging-didcomm = { workspace = true }
affinidi-secrets-resolver = { workspace = true }
tokio-util = { workspace = true }
affinidi-did-resolver-cache-sdk = "0.8"
axum = "0.8"
axum-extra = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
ed25519-dalek = { workspace = true }
fjall = { workspace = true, optional = true }
jsonwebtoken = { workspace = true }
multibase = { workspace = true }
rand = { workspace = true }
bip39 = "2"
reqwest = { workspace = true }
url = { workspace = true }
rust-embed = { workspace = true, optional = true }
webauthn-rs = { workspace = true }
mime_guess = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = "1.0"
vta-sdk = { workspace = true }
tower-http = { version = "0.7", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
aws-sdk-secretsmanager = { version = "1", optional = true }
aws-config = { version = "1", features = [
  "behavior-version-latest",
], optional = true }
google-cloud-secretmanager-v1 = { version = "1", optional = true }
google-cloud-auth = { version = "1", optional = true }
bytes = { version = "1", optional = true }
redis = { version = "1.0", features = ["tokio-comp", "aio"], optional = true }
aws-sdk-dynamodb = { version = "1", optional = true }
firestore = { version = "0.50", optional = true }
futures = { version = "0.3", optional = true }
azure_data_cosmos = { version = "0.37", features = [
  "key_auth",
], optional = true }
azure_core = { version = "1.0", optional = true }
azure_security_keyvault_secrets = { version = "1.0", optional = true }
azure_identity = { version = "1.0", optional = true }
# Enabled by the `test-support` feature so the in-process `TestServer` fixture
# can open a temporary fjall store. Optional + non-default: a production build
# never pulls it in.
tempfile = { version = "3", optional = true }

[dev-dependencies]
anyhow.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64 = { workspace = true }
# Embedded mediator fixture for in-process DIDComm flow tests.
# Defaults to MemoryStore (no Redis required); spawns on 127.0.0.1:0.
affinidi-messaging-test-mediator = "0.2"
# Self-dependency with `test-support` on, so this crate's own integration
# tests compile the `test_support` module (and get `tempfile`) exactly as a
# downstream consumer would via `features = ["test-support"]`.
did-hosting-control = { path = ".", features = ["test-support"] }
