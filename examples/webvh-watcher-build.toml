# ============================================================================
# WebVH Watcher Build Recipe
# ============================================================================
#
# Drives `webvh-watcher setup --from <this-file>` non-interactively. The
# watcher has its own DID, provisioned from a VTA context; its keys and the
# context credential go to the secrets backend.
#
# Online mode needs a setup key first:
#   webvh-watcher setup --setup-key-out setup-key.json --context webvh
#   (run the printed `pnm contexts create` command)
#   webvh-watcher setup --from webvh-watcher-build.toml --setup-key-file setup-key.json
# ============================================================================

[deployment]
service = "watcher"
vta_mode = "online"  # or "offline-prepare" / "offline-complete"

[output]
config_path = "config.toml"

[server]
host = "0.0.0.0"
port = 8533
log_level = "info"
log_format = "text"
data_dir = "data/webvh-watcher"

[identity]
# The mediator the watcher's DID advertises for TSP and DIDComm.
mediator_did = "did:webvh:mediator.example.com"

[vta]
did = "did:webvh:vta.example.com"
context_id = "webvh"

[secrets]
backend = "keyring"
keyring_service = "webvh-watcher"

[watcher]
# The control planes this watcher mirrors. Only a webvh/sync/* Trust Task
# signed by one of these DIDs is applied.
source_dids = ["did:webvh:control.example.com"]
