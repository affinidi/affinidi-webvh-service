# ============================================================================
# DID Hosting Daemon — self-managed (no VTA) Build Recipe
# ============================================================================
#
# The quickest way to a working single-host install:
#
#   did-hosting-daemon setup --from examples/did-hosting-daemon-self-managed.toml
#   did-hosting-daemon invite --did <your-admin-did> --role admin
#   did-hosting-daemon
#
# No VTA is involved: setup generates the daemon's own keys and self-hosts
# its did:webvh at `public_url`. It runs as shipped against localhost; for a
# real deployment change `public_url` (and `[server].host`) and pick a
# secrets backend that suits the host. For the VTA-managed variant see
# `did-hosting-daemon-build.toml`.
#
# SECURITY: This file contains NO secrets. Keys are generated by setup and
# stored in the configured secrets backend.
# ============================================================================

[deployment]
service = "daemon"
vta_mode = "self-managed"

[output]
config_path = "config.toml"

[server]
host = "127.0.0.1"
port = 8534
log_level = "info"
log_format = "text"
data_dir = "data/daemon"

[identity]
# The daemon's DID is minted for this origin and its log is served here.
# Loopback http is accepted for local use; anything else must be https.
public_url = "http://localhost:8534"
# Optional: a mediator makes the daemon reachable over TSP / DIDComm.
# mediator_did = "did:webvh:mediator.example.com"
# transport = "both"

[daemon]
enable_control = true
enable_server  = true
enable_witness = true
enable_watcher = false

[secrets]
# The OS credential store (macOS Keychain, Secret Service on Linux desktop,
# Windows Credential Manager). On a headless host pick vault, k8s or a cloud
# backend instead — see did-hosting-daemon-build.toml for the options.
backend = "keyring"
keyring_service = "did-hosting-daemon"

[admin]
# Grant the first administrator afterwards with
# `did-hosting-daemon invite --did <DID> --role admin` (passkey enrolment)
# or `did-hosting-daemon add-acl --did <DID> --role admin`.
mode = "skip"

[reprovision]
force = false
